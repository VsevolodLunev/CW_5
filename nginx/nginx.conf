upstream django_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
    root /usr/share/nginx/html;
    index index.html;

    # SSL-конфигурация
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+AESGCM:EECDH+CHACHA20:DH+AESGCM:ECDSA+AES128:RSA+AES128:ECDHE-RSA-AES128-GCM-SHA256:HIGH:!MD5:!aNULL:!RC4;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";


    location /static/ {
        root /usr/share/nginx/html/;
        autoindex on;
    }

    location / {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_pass http://django_backend;
    }

    # Правила сжатия
    gzip on;
    gzip_types text/plain application/xml application/javascript text/css application/json;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # Лимиты соединений
    client_max_body_size 10m;
    keepalive_timeout 65;

    # Адаптация скорости чтения/записи
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Настройки кэша заголовков
    add_header Cache-Control public;
    expires max;

    # Логирование ошибок
    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log main;
}
