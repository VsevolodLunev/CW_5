services:
  db:
    image: postgres:14
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: template1
      POSTGRES_USER: vsevolodlunev
      POSTGRES_PASSWORD: 4455
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/custom/data/postgresql/data
      - ./pg_hba.conf:/custom/data/postgresql/data/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsevolodlunev -d template1"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    restart: always
    depends_on:
      - db
    env_file: ".env.ci"
    ports:
      - "5050:80"

  redis:
    image: redis:6.2.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 10

  backend:
    build: .
    command: bash -c 'python3 manage.py migrate && python3 manage.py runserver 0.0.0.0:8000'
    env_file: .env.ci
    environment:
      POSTGRES_HOST: db
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  static_collector:
    build: .
    command: bash -c 'python3 manage.py collectstatic --no-input'
    env_file: .env.ci
    volumes:
      - django_static:/app/static/

  web:
    image: nginx:1.19.3
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
      static_collector:
        condition: service_completed_successfully
    volumes:
      - ./nginx/:/etc/nginx/conf.d/
      - django_static:/usr/share/nginx/html/static/

  celery-worker:
      build: .
      env_file: .env.ci
      environment:
        POSTGRES_HOST: db
        POSTGRES_PORT: 5432
        REDIS_URL: "redis://redis:6379/0"
        REDIS_PORT: 6379
      depends_on:
        db:
          condition: service_healthy
      command: celery -A config worker -l INFO


volumes:
  pg_data:
  django_static: