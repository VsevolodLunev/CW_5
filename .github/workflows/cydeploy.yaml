name: Deploy on Production

on:
  # workflow_run:
  #  workflows: ["Django CI"]
  #  types: [completed]

  push:
    branches: [ develop, feature3 ]
  pull_request:
    branches: [ develop, feature3 ]

jobs:
  build:
    runs-on: ubuntu-latest
    # if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/con-to-dep
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - uses: docker/setup-buildx-action@v2

      - name: Get commit SHA tag
        id: tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          target: release_image
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/con-to-dep:${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/con-to-dep:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Test SSH connection
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "SSH connection successful!"
            whoami
            pwd

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Создать директорию
            mkdir -p sevalunev/con-to-dep
            cd sevalunev/con-to-dep
            
            # Создать docker-compose.yml с реальными значениями
            cat > docker-compose.yml << 'EOF'
            services:
              db:
                 image: postgres:14
                 environment:
                   POSTGRES_DB: ${DB_NAME}
                   POSTGRES_USER: ${DB_USER}
                   POSTGRES_PASSWORD: ${DB_PASSWORD}
                 volumes:
                   - pg_data:/var/lib/postgresql/data  
                 healthcheck:
                   test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
                   interval: 5s
                   timeout: 3s
                   retries: 10
            
              pgadmin:
                image: dpage/pgadmin4
                environment:
                  PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
                  PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
                restart: always
                depends_on:
                  db:
                    condition: service_healthy
              
              redis:
                image: redis:6.2-alpine
                healthcheck:
                  test: ["CMD", "redis-cli", "ping"]
                  interval: 5s
                  timeout: 3s
                  retries: 5

              backend:
                image: ${APP_IMAGE}:latest  # исправлено на переменную
                command: >
                  sh -c "python manage.py migrate && 
                         python manage.py collectstatic --no-input &&
                         gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 3"
                env_file: .env
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                ports:
                  - "8000:8000"

              web:
                image: nginx:alpine
                ports:
                 - "80:80"
                depends_on:
                  - backend
                volumes:
                  - ./nginx/:/etc/nginx/conf.d/
                  - django_static:/usr/share/nginx/html/static/

              celery-worker:
                image: ${APP_IMAGE}:latest
                env_file: .env
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                command: celery -A config worker -l INFO

            volumes:
              pg_data:
              django_static:
            EOF
            
            # Создать .env с реальными значениями из секретов
            cat > .env << EOF
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            APP_IMAGE=${{ secrets.DOCKER_HUB_USERNAME }}/con-to-dep:${{ github.sha }}
            PGADMIN_EMAIL=admin@admin.com
            PGADMIN_PASSWORD=admin
            DEBUG=False
            EOF
    
            # Создать базовую nginx конфигурацию
            mkdir -p nginx
            cat > nginx/default.conf << 'EOF'
            server {
            listen 80;
            server_name _;
            location / {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            }
            location /static/ {
            alias /usr/share/nginx/html/static/;
            }
            }
            EOF

      - name: Run compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd sevalunev/con-to-dep
            docker compose pull
            docker compose up -d

      - name: Cleanup
        if: always()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker system prune -a -f


