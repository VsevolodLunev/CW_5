name: Deploy on Production

on:
  push:
    branches: [ develop, feature3 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          target: release_image
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/con-to-dep:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p sevalunev/con-to-dep
            cd sevalunev/con-to-dep
            
            # Создать .env с простым тегом latest
            cat > .env << EOF
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            APP_IMAGE=${{ secrets.DOCKER_HUB_USERNAME }}/con-to-dep:latest
            PGADMIN_EMAIL=admin@admin.com
            PGADMIN_PASSWORD=admin
            DEBUG=False
            EOF
            
            # Создать docker-compose.yml
            cat > docker-compose.yml << 'EOF'
            services:
              db:
                image: postgres:14
                environment:
                  POSTGRES_DB: ${DB_NAME}
                  POSTGRES_USER: ${DB_USER}
                  POSTGRES_PASSWORD: ${DB_PASSWORD}
                volumes:
                  - pg_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
                  interval: 5s
                  timeout: 3s
                  retries: 10

              pgadmin:
                image: dpage/pgadmin4
                environment:
                  PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
                  PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
                restart: always
                depends_on:
                  db:
                    condition: service_healthy

              redis:
                image: redis:6.2-alpine
                healthcheck:
                  test: ["CMD", "redis-cli", "ping"]
                  interval: 5s
                  timeout: 3s
                  retries: 5

              backend:
                image: ${APP_IMAGE}
                command: >
                  sh -c "python manage.py migrate && 
                         python manage.py collectstatic --no-input &&
                         gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 3"
                env_file: .env
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                ports:
                  - "8000:8000"

              web:
                image: nginx:alpine
                ports:
                  - "80:80"
                depends_on:
                  - backend
                volumes:
                  - ./nginx/:/etc/nginx/conf.d/
                  - django_static:/usr/share/nginx/html/static/

              celery-worker:
                image: ${APP_IMAGE}
                env_file: .env
                depends_on:
                  db:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                command: celery -A config worker -l INFO

            volumes:
              pg_data:
              django_static:
            EOF
            
            # Создать nginx конфиг
            mkdir -p nginx
            cat > nginx/default.conf << 'EOF'
            server {
                listen 80;
                server_name _;
                location / {
                    proxy_pass http://backend:8000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                }
                location /static/ {
                    alias /usr/share/nginx/html/static/;
                }
            }
            EOF

      - name: Run compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd sevalunev/con-to-dep
            docker compose pull
            docker compose down || true
            docker compose up -d --remove-orphans

      - name: Cleanup
        if: always()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker system prune -f  # безопасная очистка